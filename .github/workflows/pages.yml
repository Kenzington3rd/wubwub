# Publishes the PWA build to GitHub Pages so there's a live, clickable demo
# (https://kenzington3rd.github.io/wubwub/) instead of asking people to
# download a file before they can try the app.
#
# The build needs no base-path flag: vite.config.js uses `base: "./"` and the
# manifest uses `start_url: "."`, so every asset URL is relative and the same
# artifact works at a repo subpath, at a domain root, and from file://.
#
# ─── DORMANT UNTIL PAGES IS TURNED ON ───
# This workflow is manual-dispatch only on purpose. `configure-pages` fails
# ("Get Pages site failed: Not Found") whenever Pages is off, so an automatic
# push trigger would paint main red on every commit until the repo setting is
# flipped. To go live:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Actions tab → "Deploy demo to Pages" → Run workflow
#   3. Once a run is green, optionally re-add the auto-deploy trigger by
#      putting this block back above `workflow_dispatch:` —
#        push:
#          branches: [main]
#          paths-ignore: ["docs/**", "**/*.md"]
#      — and add the demo link to the README's "Try it now" section.
name: Deploy demo to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build PWA bundle
        run: npm run build

      # NOTE: Pages must already be enabled on the repo, with
      # Settings → Pages → Build and deployment → Source = "GitHub Actions".
      # Do NOT add `enablement: true` here — creating the Pages site needs
      # admin credentials, and the workflow's GITHUB_TOKEN doesn't have them
      # ("Resource not accessible by integration"), so it fails the job.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
