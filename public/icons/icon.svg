<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WAVECRAFT">
  <title>WAVECRAFT</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="55%" stop-color="#0f0a20"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="disc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="55%" stop-color="#3ad2ea"/>
      <stop offset="100%" stop-color="#b79cff"/>
    </linearGradient>

    <!-- The waveform is CUT OUT of the disc: black in the mask = removed.
         Negative space carries the mark, so it survives being scaled down to
         a 16 px favicon where drawn strokes would silt up. -->
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <rect x="106" y="230" width="20" height="52"  rx="10"/>
        <rect x="140" y="206" width="20" height="100" rx="10"/>
        <rect x="174" y="166" width="20" height="180" rx="10"/>
        <rect x="208" y="196" width="20" height="120" rx="10"/>
        <rect x="242" y="146" width="20" height="220" rx="10"/>
        <rect x="276" y="192" width="20" height="128" rx="10"/>
        <rect x="310" y="160" width="20" height="192" rx="10"/>
        <rect x="344" y="204" width="20" height="104" rx="10"/>
        <rect x="378" y="228" width="20" height="56"  rx="10"/>
      </g>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g mask="url(#cut)">
    <circle cx="256" cy="256" r="186" fill="url(#disc)"/>
    <!-- Grooves. Drawn in the background colour so they read as pressed vinyl
         rather than as added ink. -->
    <g fill="none" stroke="#070a14" stroke-opacity="0.28">
      <circle cx="256" cy="256" r="162" stroke-width="5"/>
      <circle cx="256" cy="256" r="138" stroke-width="5"/>
      <circle cx="256" cy="256" r="114" stroke-width="5"/>
    </g>
  </g>

  <!-- Centre label, drawn over the cut so the middle stays a solid focal
       point instead of dissolving into bars. -->
  <circle cx="256" cy="256" r="52" fill="#070a14"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#00f5d4" stroke-opacity="0.55" stroke-width="4"/>
  <circle cx="256" cy="256" r="11" fill="#f0c040"/>
</svg>
