<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a14" />
    <meta name="description" content="WAVECRAFT — free, local-only DJ mixing app. No accounts, no telemetry, nothing leaves your device." />
    <meta name="robots" content="noindex" />
    <!-- iOS Add-to-Home-Screen — Safari ignores SVG manifest icons.
         The PNG referenced below is generated from public/icons/icon.svg
         via `node scripts/render-pwa-icons.mjs`. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WAVECRAFT" />
    <!-- Defense-in-depth: enforce the local-only promise at the browser level.
         - 'unsafe-inline' for style-src is required by Vite-built CSS and our
           inline styles; we tighten the rest.
         - connect-src 'none' / frame-src 'none' / form-action 'none' — the app
           makes ZERO fetch/XHR/WebSocket/iframe/form-post requests. Workbox
           service-worker registration uses worker-src, not connect-src.
         - font-src includes data: because the single-file build inlines woff2
           as data URIs (multi-file build serves them from 'self').
         - img-src includes data: + blob: for inline SVG manifest icons and
           generated waveform/canvas snapshots respectively. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self';"
    />
    <!-- Privacy hardening: disable browser features the app never uses.
         MIDI is intentionally allowed for the MIDI controller mapping feature. -->
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), camera=(), microphone=(), interest-cohort=(), browsing-topics=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()"
    />
    <title>WAVECRAFT — Free Local DJ Mix Deck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
